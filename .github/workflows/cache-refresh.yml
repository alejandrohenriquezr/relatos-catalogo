name: Actualizar cachés de operaciones estadísticas

on:
  # Horario de Chile: 08:01, 08:06, ..., 09:56 y 10:01,
  # únicamente de lunes a viernes. La zona horaria aplica el cambio DST.
  schedule:
    - cron: "1-56/5 8-9 * * 1-5"
      timezone: "America/Santiago"
    - cron: "1 10 * * 1-5"
      timezone: "America/Santiago"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL del sitio cuya caché se actualizará"
        required: false
        default: "https://relatos-estadisticos-v2.alhen1970.chatgpt.site"

permissions:
  contents: read

# Evita que dos revisiones modifiquen las cachés al mismo tiempo.
concurrency:
  group: relatos-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Revisar fuentes INE y actualizar D1
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      # Los eventos programados solo nacen desde la rama predeterminada.
      # El checkout explícito garantiza que se ejecute el código de version_python.
      - name: Obtener código de version_python
        uses: actions/checkout@v4
        with:
          ref: version_python

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      # Cada endpoint compara la fuente oficial con la caché compartida y solo
      # conserva datos nuevos válidos; una fuente fallida no borra la caché anterior.
      - name: Revisar fuentes INE y actualizar todas las cachés
        env:
          CACHE_REFRESH_BASE_URL: ${{ inputs.base_url || 'https://relatos-estadisticos-v2.alhen1970.chatgpt.site' }}
          CACHE_REFRESH_TIMEZONE: "America/Santiago"
          SITES_BYPASS_TOKEN: ${{ secrets.SITES_BYPASS_TOKEN }}
        run: node scripts/refresh-public-cache.mjs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relatos}
      POSTGRES_USER: ${POSTGRES_USER:-relatos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relatos_dev_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relatos} -d ${POSTGRES_DB:-relatos}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - relatos_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relatos}:${POSTGRES_PASSWORD:-relatos_dev_change_me}@db:5432/${POSTGRES_DB:-relatos}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RUN_SEED: ${RUN_SEED:-true}
      PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - relatos_net

  frontend:
    # La etiqueta explícita impide que Compose reutilice una imagen anterior
    # creada antes de las correcciones del Home y Demografía de empresas.
    image: relatos-catalogo-frontend:version-python-20260914-3
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      LOCAL_D1_PATH: /var/lib/relatos-cache/cache.sqlite
    volumes:
      - frontend_cache:/var/lib/relatos-cache
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    healthcheck:
      # Comprueba que el contenedor activo contiene esta versión del frontend.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/build-version.json').then(r=>r.json()).then(v=>{if(v.release!=='version-python-20260914-3')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - relatos_net

  cache-refresh:
    # Usa la misma imagen que el frontend y activa las rutas de actualización;
    # el frontend escribe los resultados en su SQLite persistente.
    image: relatos-catalogo-frontend:version-python-20260914-3
    restart: unless-stopped
    command: ["node", "scripts/refresh-public-cache.mjs", "--daemon"]
    environment:
      CACHE_REFRESH_BASE_URL: http://frontend:3000
      CACHE_REFRESH_TIMEZONE: America/Santiago
      CACHE_REFRESH_ON_START: "true"
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - relatos_net

volumes:
  postgres_data:
  frontend_cache:

networks:
  relatos_net:
    driver: bridge
